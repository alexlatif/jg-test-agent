name: ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ci
    steps:
      - name: Require the cluster and install pinned GitHub CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -eu
          test "$RUNNER_ENVIRONMENT" = self-hosted
          tools="$RUNNER_TEMP/cluster-tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 https://github.com/cli/cli/releases/download/v2.104.0/gh_2.104.0_linux_amd64.tar.gz -o "$tools/gh.tar.gz"
          echo "98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e  $tools/gh.tar.gz" | sha256sum -c -
          tar -xzf "$tools/gh.tar.gz" --strip-components=2 -C "$tools" gh_2.104.0_linux_amd64/bin/gh
          "$tools/gh" --version
          echo "$tools" >> "$GITHUB_PATH"
      - uses: actions/checkout@v5
      - name: Verify qualified Rust
        run: rustc --version
      - uses: taiki-e/install-action@just
      - name: Run verification
        run: just verify
