name: agent-merge

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: write

jobs:
  merge:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'bot::merge')
    runs-on: ci
    steps:
      - name: Require the cluster and install pinned GitHub CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -eu
          test "$RUNNER_ENVIRONMENT" = self-hosted
          tools="$RUNNER_TEMP/cluster-tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 https://github.com/cli/cli/releases/download/v2.104.0/gh_2.104.0_linux_amd64.tar.gz -o "$tools/gh.tar.gz"
          echo "98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e  $tools/gh.tar.gz" | sha256sum -c -
          tar -xzf "$tools/gh.tar.gz" --strip-components=2 -C "$tools" gh_2.104.0_linux_amd64/bin/gh
          "$tools/gh" --version
          echo "$tools" >> "$GITHUB_PATH"
      - name: Check verification status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=$(echo "${{ github.event.issue.pull_request.url }}" | grep -oE '[0-9]+$')

          # Check for VERIFIER: PASS in comments
          VERIFIED=$(gh pr view "$PR_NUM" --json comments --jq '.comments[].body' | grep -c "VERIFIER: PASS" || echo "0")

          if [[ "$VERIFIED" -gt 0 ]]; then
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "verified=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge PR
        if: steps.check.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=$(echo "${{ github.event.issue.pull_request.url }}" | grep -oE '[0-9]+$')
          gh pr merge "$PR_NUM" --squash --delete-branch

      - name: Report failure
        if: steps.check.outputs.verified != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --body "Cannot merge: No VERIFIER: PASS found. Please ensure verification passes first."
          exit 1
